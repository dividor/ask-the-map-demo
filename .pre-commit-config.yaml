# Pre-commit hooks for code quality. See https://pre-commit.com and CONTRIBUTING.md.
#
# The hooks that need the project's own environment (mypy, bandit, the code-metrics gate) run through `uv run`,
# so they see the same package versions as the tests and CI. Install uv first: https://docs.astral.sh/uv/

default_language_version:
  python: python3.12

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  # Formatting, import order and linting (ruff does the work of black, isort and flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.8
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format

  # Secret scanning
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # Checks that use the project environment
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy --ignore-missing-imports src
        language: system
        pass_filenames: false
        types: [python]

      # Python security scanning; fails on MEDIUM and HIGH severity issues (-ll)
      - id: bandit
        name: bandit
        entry: uv run bandit -r -ll -q src scripts
        language: system
        pass_filenames: false
        types: [python]

      # Code complexity gate: cyclomatic <= 20, cognitive <= 20, maintainability index >= 20 per file
      - id: code-metrics
        name: code-metrics
        entry: uv run python scripts/quality/code_metrics.py --fail-on-bad --skip-js-cognitive
        language: system
        pass_filenames: false
        types: [python]
