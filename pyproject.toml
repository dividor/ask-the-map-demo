[project]
name = "askmap"
version = "0.1.0"
description = "Plain-English map questions over NASA POWER climate, AlphaEarth embeddings and geometry: a feasibility test"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "xarray>=2024.10",
    "zarr>=2.18",
    "s3fs>=2024.10",
    "h5netcdf>=1.4",
    "h5py>=3.11",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "affine>=2.4",
    "scipy>=1.13",
    "requests>=2.32",
    "earthengine-api>=1.7",
    "google-auth>=2.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "torch>=2.6",
    "sentence-transformers>=3.0",
    "transformers>=4.45",
    "openai>=1.60",
    "huggingface-hub>=0.30",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "httpx>=0.27",
    # code quality (the same checks run as pre-commit hooks and in CI)
    "pre-commit>=4.0",
    "mypy>=1.15",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
    "bandit>=1.8",
    "lizard>=1.17",
    "radon>=6.0",
    "cognitive-complexity>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askmap"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
