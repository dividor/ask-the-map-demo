name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# the workflow token only reads the repository (needed for checkout on a private repository)
permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --locked

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest -q

  security-scan:
    runs-on: ubuntu-latest
    needs: code-quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      # Python dependency vulnerability scanning
      - name: Run pip-audit
        run: |
          uv export --frozen --no-dev --format requirements-txt --no-hashes > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --desc on

      # Python SAST with Bandit (MEDIUM and HIGH severity fail the job)
      - name: Run Bandit
        run: uvx bandit -r -ll src scripts

      # Secret scanning across the whole history
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
