# Questions and hand-written reference plans.
# Truth for each question = its reference plan run on the official layers (CDL 2024, NWI, USPVDB) + NASA POWER.

sources:
  power_summit_2025: "NASA POWER 2025 Global Community Summit report (users' talks and requests): https://power.larc.nasa.gov/global-community-summit/reports/power-2025-global-community-summit-summary-report.pdf"
  nse_2026: "New Space Economy, Oct 2026, summary of a NASA POWER presentation (utilities, solar monitoring, rooftop solar, building design): https://newspaceeconomy.ca/2026/10/11/how-does-nasa-power-support-energy-and-building-decisions/"
  power_poster_2026: "NASA POWER poster, May 2026 (energy, infrastructure, agriculture uses): https://ntrs.nasa.gov/citations/20260004310"
  gao_21_241: "GAO-21-241 on USDA wetland conservation compliance (Swampbuster spot checks; risk-based selection recommended): https://www.gao.gov/products/gao-21-241"
  fsa_lfp: "USDA FSA Livestock Forage Disaster Program (drought on grazing land); this repo's LFP work. Program page not re-checked: https://www.fsa.usda.gov/resources/programs/livestock-forage-disaster-program-lfp"
  rma_pp: "USDA RMA prevented planting (planting prevented by excess wet weather); this repo's 1-in-4 work. Page not re-checked: https://www.rma.usda.gov/topics/prevented-planting"
  rma_col: "USDA RMA Cause of Loss data (drought, heat, excess moisture), used in this repo's phase 0: https://www.rma.usda.gov/tools-reports/summary-business/cause-loss"

personas:
  nrcs: "NRCS wetland compliance staff (Swampbuster)"
  fsa_pp: "FSA / RMA staff checking prevented-planting claims"
  fsa_lfp: "FSA staff checking drought on grazing land (LFP)"
  rma: "RMA crop-insurance analyst comparing losses with weather"
  power_ag: "NASA POWER agroclimatology user (crop modelling, risk zoning)"
  power_energy: "NASA POWER energy user (solar siting, utility planning)"
  power_build: "NASA POWER buildings user (heating and cooling design)"

