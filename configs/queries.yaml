    question: "In the North Dakota study area, show cropland within 100 m of a wetland."
    plan: {area: north_dakota, land: {classes: [cropland], min_patch_ha: null},
           near: [{classes: [wetland], distance_m: 100, negate: false}], climate: [], output: map}
